name: fern-lockfile

# Fern builds pnpm-lock.yaml from its default dependencies before our customizations (Renovate's pnpm and devDependency
# bumps) are re-applied, so `pnpm install --frozen-lockfile` fails in ci on its PRs. This regenerates the lockfile for
# the Fern branch and commits it back. Remove once Fern ships a lockfile that matches package.json.
#
# Two jobs keep the write token away from the branch's code:
#   resolve  runs pnpm on the branch with a read-only token and hands over only pnpm-lock.yaml
#   commit   has the write token, never checks out or runs branch code, and commits that one file through the API
#
# Pushes made with GITHUB_TOKEN do not trigger other workflows, so ci and integration are dispatched explicitly.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  resolve:
    # Only Fern's branches in this repo. Forks get a read-only token, so they are skipped.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'fern-bot/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}

    steps:
      - name: Checkout Fern branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6

      # Resolves the lockfile only: nothing is installed and no lifecycle scripts run.
      - name: Regenerate lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload lockfile
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  commit:
    needs: resolve
    if: needs.resolve.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.head_ref }}
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Download lockfile
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pnpm-lock
          path: lockfile

      # The artifact came from a job that ran the branch's package.json, so treat it as untrusted input.
      - name: Validate lockfile
        run: |
          test "$(find lockfile -type f | wc -l)" -eq 1
          test -f lockfile/pnpm-lock.yaml
          test "$(stat -c %s lockfile/pnpm-lock.yaml)" -lt 5242880
          head -n 3 lockfile/pnpm-lock.yaml | grep -Eq '^lockfileVersion:'

      - name: Commit lockfile to the branch
        run: |
          # Branch names are user-controlled; encode them before putting them in a URL (slashes stay as path separators).
          branch_path="$(jq -rn --arg b "$BRANCH" '$b | @uri' | sed 's/%2F/\//g')"
          branch_query="$(jq -rn --arg b "$BRANCH" '$b | @uri')"
          tip="$(gh api "repos/${GH_REPO}/git/ref/heads/${branch_path}" --jq .object.sha)"
          if [ "$tip" != "$EXPECTED_SHA" ]; then
            echo "::notice::Branch moved since this run started; the next sync will regenerate the lockfile."
            exit 0
          fi
          file_sha="$(gh api "repos/${GH_REPO}/contents/pnpm-lock.yaml?ref=${branch_query}" --jq .sha)"
          base64 -w0 lockfile/pnpm-lock.yaml | jq -Rs \
            --arg branch "$BRANCH" --arg sha "$file_sha" \
            '{message: "chore: sync pnpm-lock.yaml with package.json", content: ., sha: $sha, branch: $branch}' \
            > body.json
          gh api -X PUT "repos/${GH_REPO}/contents/pnpm-lock.yaml" --input body.json > /dev/null

      # The commit does not trigger workflows, so run the checks against the branch. Dispatching is idempotent, so it runs
      # even when the commit step found the branch already moved, which keeps a re-run of a half-failed job able to recover.
      - name: Run checks on the branch
        run: |
          gh workflow run ci.yml --ref "$BRANCH"
          gh workflow run integration.yml --ref "$BRANCH"
